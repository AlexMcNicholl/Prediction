name: Screener

# Recurring run: ingest fresh Kalshi data, recompute signals, regenerate the
# dashboard, and send the digest.
#
# Nothing is committed back. The SQLite database rides a rolling actions/cache
# between runs and is also uploaded as an artifact; committing a growing binary
# several times a day would bloat the repo permanently.
#
# Cadence lives here - GitHub reads cron only from the workflow file, never
# from config.yaml.
on:
  schedule:
    # Hourly through ET waking hours. This repo is public, so Actions minutes
    # are unlimited and cost no longer sets the cadence - but Kalshi's public
    # API is a shared resource, so we skip the overnight dead zone rather than
    # poll around the clock for contracts that are not moving.
    # Times are UTC (cron has no timezone); in November ET shifts to EST and
    # these land an hour earlier locally. Off the hour on purpose: :00 is the
    # most congested slot on Actions and runs there are routinely delayed.
    - cron: "17 11-23 * * *"  # 07:17 - 19:17 ET
    - cron: "17 0-3 * * *"    # 20:17 - 23:17 ET
  workflow_dispatch:
    inputs:
      skip_notify:
        description: "Build the digest but do not send it"
        type: boolean
        default: false
      max_pages:
        description: "Cap market pages (leave blank for all)"
        type: string
        default: ""

# Never let two runs write the SQLite file at once.
concurrency:
  group: screener-${{ github.ref }}
  cancel-in-progress: false

# Read-only: results leave as artifacts and the digest, so nothing is
# committed back and no write token is needed.
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Snapshot history is the point of this system, so the DB must survive
      # between runs - but committing a growing binary to git would bloat the
      # repo permanently (git stores every version of a binary in full).
      # A rolling cache carries it forward; the artifact below is the durable
      # copy you can download if a cache is ever evicted.
      - name: Restore the screener database
        uses: actions/cache@v4
        with:
          path: data/screener.db
          key: screener-db-${{ github.run_id }}
          restore-keys: |
            screener-db-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # continue-on-error keeps a failed verification from blocking ingestion,
      # but it also makes the step show a GREEN CHECK in the UI even when it
      # failed. The next step exists so the real outcome is impossible to
      # misread: it always runs and always states the result.
      - name: Verify the live Kalshi API
        id: verify
        continue-on-error: true
        run: python -m screener.cli verify-api

      - name: Report API verification result
        if: always()
        run: |
          if [ "${{ steps.verify.outcome }}" = "success" ]; then
            echo "✅ **API verification passed** — endpoints, field names, \
          pagination and the cents assumption all match." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ **API verification FAILED** (outcome: \
          ${{ steps.verify.outcome }}) — see the 'Verify the live Kalshi API' \
          step log. Either the API changed, or requests were rate-limited. \
          Ingestion continues; unmapped fields degrade to NULL." \
            >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Kalshi API verification failed::verify-api \
          reported failures. Check whether this is drift or rate limiting."
          fi

      - name: Run the screener
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          QUOTE_API_KEY: ${{ secrets.QUOTE_API_KEY }}
          # So the digest links to the published dashboard. Optional: set the
          # repository variable DASHBOARD_URL once Pages is live.
          SCREENER_DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.skip_notify }}" = "true" ]; then ARGS="$ARGS --no-notify"; fi
          if [ -n "${{ inputs.max_pages }}" ]; then ARGS="$ARGS --max-pages ${{ inputs.max_pages }}"; fi
          python -m screener.cli run $ARGS

      - name: Export CSVs for external analysis
        run: python -m screener.cli export --format csv

      - name: Upload dashboard, digest and database
        uses: actions/upload-artifact@v4
        with:
          name: screener-output
          path: |
            out/
            exports/
            data/screener.db
          retention-days: 90

      - name: Report database size
        if: always()
        run: |
          if [ -f data/screener.db ]; then
            echo "### Screener run" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Database: $(du -h data/screener.db | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
            python -m screener.cli info >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi

      # Pages serves the site root, so the dashboard needs to be index.html.
      - name: Prepare the Pages site
        if: vars.PUBLISH_PAGES == 'true'
        run: cp out/dashboard.html out/index.html

      - name: Upload Pages artifact
        if: vars.PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  # Optional: publish the dashboard to GitHub Pages so it has a stable phone URL.
  # Enable by setting the repository variable PUBLISH_PAGES=true and turning on
  # Pages (Settings -> Pages -> Source: GitHub Actions).
  deploy-pages:
    needs: run
    if: vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Link the dashboard
        run: |
          echo "📊 **Dashboard:** ${{ steps.deployment.outputs.page_url }}" \
            >> "$GITHUB_STEP_SUMMARY"
